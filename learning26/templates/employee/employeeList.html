<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>EMPLOYEE LIST</h1>
<a href="{% url 'employee:createEmployeeWithForm'%}">CREATE EMPLOYEE<a/>
<a href ="{% url 'employee:employeeFilter' %}">FILTER</a>    
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Salary</th>
            <th>Join Date</th>
            <th>Post</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for emp in employees  %}
        <tr>
            <td>{{emp.id}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.age}}</td>
            <td>{{emp.salary}}</td>
            <td>{{emp.join_date}}</td>
            <td>{{emp.post}}</td>
            <td>
                {% comment %} <a href="{% url 'deleteEmployee' %}">DELETE</a> {% endcomment %}
                 <a href = "{% url 'employee:deleteEmployee' emp.id %}">DELETE</a>
                 <a href = "{% url 'employee:updateEmployee' emp.id %}">UPDATE</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
