{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
{% include 'usernavbar.html' %}
<div class="form-wrapper">
    <h2 class="form-title">Add / Update Service</h2>

    <form method="POST" novalidate>
        {% csrf_token %}
        
        {{ form|crispy }}

        <button type="submit" class="submit-btn">
            Save Service 🚀
        </button>
    </form>
</div>

{% endblock %}
