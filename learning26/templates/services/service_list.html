<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service List</title>
</head>
<body>
    <h2>Service List</h2>

<a href="{% url 'services:service_create' %}">Create Service</a>
<hr>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>

    {% for s in services %}
    <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.price }}</td>
        <td>{{ s.description }}</td>
        <td>
            <a href="{% url 'services:service_update' s.id %}">Update</a>
            <a href="{% url 'services:service_delete' s.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
